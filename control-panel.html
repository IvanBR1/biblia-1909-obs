<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Biblia - OBS</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="control-panel">
            <div class="panel-heading">
                <h3><i class="fas fa-book-open"></i> Selección bíblica</h3>
                <button id="settings-button" class="icon-button" type="button" aria-label="Abrir configuración" aria-controls="settings-drawer" aria-expanded="false" title="Configuración"><i class="fas fa-gear"></i></button>
            </div>
            <div class="form-container">
                <div class="form-group">
                    <label for="book-select"><i class="fas fa-book"></i> Libro</label>
                    <div class="select-container"><div class="select-search-container">
                        <input type="text" id="book-search" class="select-with-search" placeholder="Buscar libro..." autocomplete="off">
                        <span class="search-icon"><i class="fas fa-search"></i></span><div id="book-dropdown" class="search-dropdown"></div>
                    </div><select id="book-select" style="display:none"></select></div>
                </div>
                <div class="form-group"><div class="number-inputs">
                    <div><label for="chapter-input"><i class="fas fa-list-ol"></i> Capítulo</label><input type="number" id="chapter-input" min="1" value="1" placeholder="Cap."></div>
                    <div><label for="verse-input"><i class="fas fa-verse"></i> Versículo</label><input type="number" id="verse-input" min="1" value="1" placeholder="Vs."></div>
                </div></div>
                <div class="controls"><button id="prev-verse" class="btn btn-primary" title="Versículo anterior"><i class="fas fa-arrow-left"></i></button><button id="next-verse" class="btn btn-primary" title="Versículo siguiente"><i class="fas fa-arrow-right"></i></button></div>
                <div class="switch-container"><span class="switch-label">Mostrar en OBS</span><label class="switch"><input type="checkbox" id="visibility-toggle"><span class="slider"></span></label></div>
            </div>
        </div>

        <div class="preview-panel collapsible-section">
            <button class="section-toggle panel-toggle" type="button" aria-expanded="false"><span><i class="fas fa-eye"></i> Vista previa</span><i class="fas fa-chevron-down"></i></button>
            <div class="preview-content section-body">
                <div id="preview-current" class="preview-verse current"><div class="verse-header"><span class="verse-ref">Actual</span></div><div class="verse-text">Seleccione un versículo</div></div>
                <div id="preview-next" class="preview-verse next"><div class="verse-header"><span class="verse-ref">Siguiente</span></div><div class="verse-text">Seleccione un versículo</div></div>
            </div>
        </div>
        <div class="history-panel collapsible-section">
            <button class="section-toggle panel-toggle" type="button" aria-expanded="false"><span><i class="fas fa-history"></i> Historial (últimos 10)</span><i class="fas fa-chevron-down"></i></button>
            <ul id="history-list" class="history-list section-body"></ul>
        </div>
    </div>

    <aside id="settings-drawer" class="settings-drawer" aria-hidden="true" aria-labelledby="settings-title">
        <div class="settings-header"><div><span class="eyebrow">Personalización</span><h2 id="settings-title">Tema y estilo</h2></div><button id="settings-close" class="icon-button" type="button" aria-label="Cerrar configuración"><i class="fas fa-xmark"></i></button></div>
        <div class="settings-body">
            <section class="settings-section"><h4>Elige un tema</h4><div id="theme-list" class="theme-list" role="radiogroup" aria-label="Temas disponibles"></div></section>
            <section class="settings-section settings-grid">
                <h4>Texto y posición</h4>
                <label for="text-x">Posición horizontal <output for="text-x" id="text-x-value"></output></label><input type="range" id="text-x" min="5" max="95" value="50">
                <label for="text-y">Posición vertical <output for="text-y" id="text-y-value"></output></label><input type="range" id="text-y" min="5" max="85" value="16">
                <label for="font-family">Tipo de letra</label><select id="font-family"></select>
                <label for="font-size">Tamaño de fuente <output for="font-size" id="font-size-value"></output></label><input type="range" id="font-size" min="18" max="96" value="52">
                <label for="text-color">Color del texto</label><input type="color" id="text-color" value="#f8efe0">
                <label for="text-align">Alineación</label><select id="text-align"><option value="left">Izquierda</option><option value="center">Centro</option><option value="right">Derecha</option></select>
                <label for="line-height">Espaciado entre líneas <output for="line-height" id="line-height-value"></output></label><input type="range" id="line-height" min="0.8" max="2.5" step="0.1" value="1.2">
            </section>
            <section class="settings-section settings-grid">
                <h4>Contenedor y contraste</h4>
                <label for="background-color">Color del fondo</label><input type="color" id="background-color" value="#17212b">
                <label for="background-opacity">Transparencia del fondo <output for="background-opacity" id="background-opacity-value"></output></label><input type="range" id="background-opacity" min="0" max="100" value="88">
                <div class="switch-container compact"><span class="switch-label">Mostrar fondo del tema</span><label class="switch"><input type="checkbox" id="background-toggle" checked><span class="slider"></span></label></div>
                <label for="padding">Márgenes internos <output for="padding" id="padding-value"></output></label><input type="range" id="padding" min="0" max="120" value="32">
                <label for="max-width">Ancho máximo <output for="max-width" id="max-width-value"></output></label><input type="range" id="max-width" min="320" max="1800" step="20" value="1120">
                <label for="text-effect">Efecto de contraste</label><select id="text-effect"><option value="none">Ninguno</option><option value="shadow">Sombra</option><option value="outline">Contorno</option><option value="contrast">Contraste</option></select>
            </section>
            <button id="reset-theme-settings" class="btn btn-secondary" type="button"><i class="fas fa-rotate-left"></i> Restaurar valores del tema</button>
        </div>
    </aside>
    <div id="settings-scrim" class="settings-scrim" hidden></div>
    <script src="themes/index.js"></script>
    <script src="control.js"></script>
</body>
</html>
