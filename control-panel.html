<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Biblia - OBS</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="control-panel">
            <h3><i class="fas fa-sliders-h"></i> Controles</h3>
            <div class="form-container">
                <div class="form-group">
                    <label for="book-select"><i class="fas fa-book"></i> Libro</label>
                    <div class="select-container">
                        <div class="select-search-container">
                            <input type="text" id="book-search" class="select-with-search" placeholder="Buscar libro..."
                                autocomplete="off">
                            <span class="search-icon"><i class="fas fa-search"></i></span>
                            <div id="book-dropdown" class="search-dropdown"></div>
                        </div>
                        <select id="book-select" style="display: none;"></select>
                    </div>
                </div>

                <section class="collapsible-section open">
                    <button class="section-toggle" type="button" aria-expanded="true">
                        <span><i class="fas fa-location-arrow"></i> Navegación</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="section-body">
                        <div class="form-group">
                            <div class="number-inputs">
                                <div>
                                    <label for="chapter-input"><i class="fas fa-list-ol"></i> Capítulo</label>
                                    <input type="number" id="chapter-input" min="1" value="1" placeholder="Cap.">
                                </div>
                                <div>
                                    <label for="verse-input"><i class="fas fa-verse"></i> Versículo</label>
                                    <input type="number" id="verse-input" min="1" value="1" placeholder="Vs.">
                                </div>
                            </div>
                        </div>

                        <div class="controls">
                            <button id="prev-verse" class="btn btn-primary" title="Versículo anterior">
                                <i class="fas fa-arrow-left"></i>
                            </button>
                            <button id="next-verse" class="btn btn-primary" title="Versículo siguiente">
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </section>

                <section class="collapsible-section open">
                    <button class="section-toggle" type="button" aria-expanded="true">
                        <span><i class="fas fa-palette"></i> Tema</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="section-body">
                        <div class="theme-controls">
                            <div class="range-control">
                                <label for="text-x"><i class="fas fa-arrows-left-right"></i> Posición horizontal</label>
                                <input type="range" id="text-x" min="5" max="95" value="50">
                            </div>
                            <div class="range-control">
                                <label for="text-y"><i class="fas fa-arrows-up-down"></i> Posición vertical</label>
                                <input type="range" id="text-y" min="5" max="70" value="16">
                            </div>
                            <div class="switch-container compact">
                                <span class="switch-label">Fondo del tema</span>
                                <label class="switch">
                                    <input type="checkbox" id="background-toggle" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="switch-container">
                    <span class="switch-label">Mostrar/Ocultar</span>
                    <label class="switch">
                        <input type="checkbox" id="visibility-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="preview-panel collapsible-section open">
            <button class="section-toggle panel-toggle" type="button" aria-expanded="true">
                <span><i class="fas fa-eye"></i> Vista previa</span>
                <i class="fas fa-chevron-down"></i>
            </button>
            <div class="preview-content section-body">
                <div id="preview-current" class="preview-verse current">
                    <div class="verse-header">
                        <span class="verse-ref">Actual</span>
                    </div>
                    <div class="verse-text">Seleccione un versículo</div>
                </div>
                <div id="preview-next" class="preview-verse next">
                    <div class="verse-header">
                        <span class="verse-ref">Siguiente</span>
                    </div>
                    <div class="verse-text">Seleccione un versículo</div>
                </div>
            </div>
        </div>

        <div class="history-panel collapsible-section open">
            <button class="section-toggle panel-toggle" type="button" aria-expanded="true">
                <span><i class="fas fa-history"></i> Historial (últimos 10)</span>
                <i class="fas fa-chevron-down"></i>
            </button>
            <ul id="history-list" class="history-list section-body"></ul>
        </div>
    </div>

    <script src="control.js"></script>
</body>

</html>
