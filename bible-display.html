<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblia - Visualizador para OBS</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            --transition: all 0.5s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: transparent;
            color: var(--light-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .verse-container {
            width: 90%;
            max-width: 1000px;
            background: rgba(44, 62, 80, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            text-align: left;
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            position: relative;
            border-left: 5px solid var(--secondary-color);
        }

        .verse-container.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .verse-text {
            font-family: 'Merriweather', serif;
            font-size: 1.8rem;
            line-height: 1.6;
            margin-bottom: 15px;
            text-align: left;
            white-space: pre-line;
            word-wrap: break-word;
        }

        .verse-content {
            margin-bottom: 10px;
        }

        .verse-titles {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .verse-title {
            font-size: 1.2rem;
            color: var(--secondary-color);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .verse-body {
            font-size: 1.8rem;
            line-height: 1.6;
        }

        .verse-reference {
            font-size: 1.4rem;
            text-align: right;
            color: var(--secondary-color);
            font-weight: 600;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes slideIn {
            from {
                transform: translateY(100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .slide-in {
            animation: slideIn 0.8s ease;
        }
    </style>
</head>

<body>
    <div class="verse-container" id="verse-container">
        <div class="verse-content">
            <div class="verse-text" id="verse-text">En el principio creó Dios los cielos y la tierra.</div>
        </div>
        <div class="verse-reference" id="verse-reference">Génesis 1:1</div>
    </div>

    <script>
        // Elementos del DOM
        const verseContainer = document.getElementById('verse-container');
        const verseText = document.getElementById('verse-text');
        const verseReference = document.getElementById('verse-reference');

        // Estado actual
        let currentVerse = {
            book: 'GEN',
            chapter: 1,
            verse: 1,
            text: 'En el principio creó Dios los cielos y la tierra.',
            reference: 'Génesis 1:1'
        };

        // Función para formatear el contenido del versículo
        function formatVerseContent(content) {
            if (!content) return 'Texto no disponible';
            
            // Separar las líneas
            const lines = content.split('\n');
            let formattedContent = '';
            
            // Procesar cada línea
            lines.forEach((line, index) => {
                line = line.trim();
                
                if (line) {
                    // Si la línea parece ser un título (comienza con número o tiene punto al final de una palabra corta)
                    if (/^\d+\s+[A-Za-záéíóúÁÉÍÓÚñÑ]/.test(line) || 
                        /^[A-Za-záéíóúÁÉÍÓÚñÑ]{1,20}\.$/.test(line) ||
                        line.includes('.\n') && line.length < 30) {
                        // Es un título o subtítulo
                        formattedContent += `<div class="verse-title">${line}</div>`;
                    } else {
                        // Es contenido del versículo
                        // Eliminar referencias entre corchetes al inicio
                        line = line.replace(/^\[\d+\]\s*/, '');
                        // Eliminar múltiples espacios
                        line = line.replace(/\s+/g, ' ');
                        
                        // Si es la primera línea de contenido, no agregar margen extra
                        if (formattedContent.indexOf('verse-body') === -1) {
                            formattedContent += `<div class="verse-body">${line}</div>`;
                        } else {
                            formattedContent += `<div class="verse-body" style="margin-top: 10px;">${line}</div>`;
                        }
                    }
                }
            });
            
            return formattedContent;
        }

        // Mostrar/ocultar el versículo
        function showVerse() {
            verseContainer.classList.add('visible', 'slide-in');
        }

        function hideVerse() {
            verseContainer.classList.remove('visible', 'slide-in');
        }

        // Cargar un versículo específico
        async function loadVerse(bookId, chapterNumber, verseNumber) {
            try {
                const response = await fetch(`https://biblia-api.qhar.in/book/${bookId}/chapter/${chapterNumber}/verse/${verseNumber}`);

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const verseDataArray = await response.json();

                if (!verseDataArray || verseDataArray.length === 0) {
                    throw new Error('No se encontró el versículo');
                }

                const verseData = verseDataArray[0];
                
                // Formatear el contenido
                const formattedContent = formatVerseContent(verseData.content);
                
                // Actualizar el DOM
                verseText.innerHTML = formattedContent;
                verseReference.textContent = verseData.reference || 'Referencia no disponible';

                // Actualizar estado actual
                currentVerse = {
                    book: bookId,
                    chapter: chapterNumber,
                    verse: verseNumber,
                    text: formattedContent,
                    reference: verseData.reference
                };

                return true;
            } catch (error) {
                console.error('Error al cargar el versículo:', error);
                verseText.textContent = 'Error al cargar el versículo';
                verseReference.textContent = 'Error';
                return false;
            }
        }

        // Escuchar comandos del panel de control
        function listenForCommands() {
            window.addEventListener('storage', function (e) {
                if (e.key === 'bibleVerseCommand') {
                    const command = JSON.parse(localStorage.getItem('bibleVerseCommand'));

                    if (command.action === 'load') {
                        // Si el comando ya trae el contenido formateado, usarlo directamente
                        if (command.content) {
                            verseText.innerHTML = command.content;
                            verseReference.textContent = command.reference;
                            showVerse();
                        } else {
                            // Si no, cargar desde la API
                            loadVerse(command.book, command.chapter, command.verse).then(success => {
                                if (success && command.show) {
                                    showVerse();
                                }
                            });
                        }
                    } else if (command.action === 'show') {
                        showVerse();
                    } else if (command.action === 'hide') {
                        hideVerse();
                    }

                    // Limpiar el comando después de procesarlo
                    localStorage.removeItem('bibleVerseCommand');
                }
            });

            // También verificar si hay comandos pendientes al cargar
            const pendingCommand = localStorage.getItem('bibleVerseCommand');
            if (pendingCommand) {
                const command = JSON.parse(pendingCommand);

                if (command.action === 'load') {
                    if (command.content) {
                        verseText.innerHTML = command.content;
                        verseReference.textContent = command.reference;
                        showVerse();
                    } else {
                        loadVerse(command.book, command.chapter, command.verse).then(success => {
                            if (success && command.show) {
                                showVerse();
                            }
                        });
                    }
                }

                localStorage.removeItem('bibleVerseCommand');
            }
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', function () {
            // Ocultar el versículo al inicio
            hideVerse();

            // Comenzar a escuchar comandos
            listenForCommands();
        });
    </script>
</body>

</html>
