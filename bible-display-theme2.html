<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblia - Visualizador Libro para OBS</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Libre+Baskerville:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --verse-x: 50%;
            --verse-y: 16%;
            --verse-width: min(86vw, 1180px);
            --verse-max-height: calc(100vh - var(--verse-y) - 4vh);
            --verse-font-size: clamp(2.2rem, 4.25vw, 5.6rem);
            --text-color: #f8efe0;
            --reference-color: #d9b56b;
            --shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
            --text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
            --transition-time: 900ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Libre Baskerville', Georgia, serif;
            background: transparent;
            color: var(--text-color);
        }

        .stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .background-image,
        .background-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .background-image {
            background-image: url('src/img/biblia_bg_1.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 0;
            transform: scale(1.045);
            filter: saturate(0.9) brightness(0.78);
            transition:
                opacity var(--transition-time) ease,
                transform 1400ms ease,
                filter var(--transition-time) ease;
        }

        .background-vignette {
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.16) 0%, rgba(0, 0, 0, 0.02) 34%, rgba(0, 0, 0, 0.56) 100%),
                radial-gradient(circle at 50% 13%, rgba(12, 9, 7, 0.08) 0%, rgba(0, 0, 0, 0.46) 74%);
            opacity: 0;
            transition: opacity var(--transition-time) ease;
        }

        .verse-container {
            position: absolute;
            top: var(--verse-y);
            left: var(--verse-x);
            width: var(--verse-width);
            max-height: var(--verse-max-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            opacity: 0;
            transform: translate(-50%, -18%) scale(0.985);
            transition:
                opacity 760ms ease 130ms,
                transform 900ms cubic-bezier(0.16, 1, 0.3, 1) 130ms,
                filter 900ms ease 130ms;
            filter: blur(2px);
            text-shadow: var(--text-shadow);
        }

        .verse-container.visible {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
            filter: blur(0);
        }

        body.has-verse .background-image {
            opacity: 1;
            transform: scale(1);
            filter: saturate(1) brightness(0.86);
        }

        body.has-verse .background-vignette {
            opacity: 1;
        }

        body.background-hidden.has-verse .background-image,
        body.background-hidden.has-verse .background-vignette {
            opacity: 0;
        }

        .verse-content {
            width: 100%;
            overflow: visible;
        }

        .verse-text,
        .verse-text * {
            font-family: 'Cormorant Garamond', Georgia, serif !important;
            font-size: var(--verse-font-size) !important;
            line-height: 1.08 !important;
            font-weight: 600 !important;
            letter-spacing: 0 !important;
            text-align: center !important;
            color: var(--text-color) !important;
            white-space: normal !important;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }

        .verse-body {
            margin: 0 auto;
        }

        .verse-reference {
            margin-top: clamp(0.8rem, 1.8vh, 1.45rem);
            padding-top: clamp(0.55rem, 1.2vh, 1rem);
            width: min(72%, 720px);
            border-top: 1px solid rgba(217, 181, 107, 0.52);
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: clamp(1rem, 1.55vw, 1.75rem);
            font-weight: 700;
            line-height: 1.25;
            color: var(--reference-color);
            text-align: center;
            text-shadow: var(--text-shadow);
        }

        @media (max-width: 720px) {
            :root {
                --verse-y: 12%;
                --verse-width: 90vw;
                --verse-max-height: calc(100vh - var(--verse-y) - 4vh);
            }

            .verse-text,
            .verse-text * {
                line-height: 1.1 !important;
            }

            .verse-reference {
                width: 86%;
                font-size: clamp(0.92rem, 4vw, 1.2rem);
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <div class="background-image" aria-hidden="true"></div>
        <div class="background-vignette" aria-hidden="true"></div>

        <section class="verse-container" id="verse-container">
            <div class="verse-content">
                <div class="verse-text" id="verse-text">
                    <div class="verse-body">En el principio creó Dios los cielos y la tierra.</div>
                </div>
            </div>
            <div class="verse-reference" id="verse-reference">Génesis 1:1</div>
        </section>
    </main>

    <script>
        const verseContainer = document.getElementById('verse-container');
        const verseText = document.getElementById('verse-text');
        const verseReference = document.getElementById('verse-reference');
        const desktopMaxFont = 82;
        const mobileMaxFont = 56;
        const minFont = 24;

        let currentVerse = {
            book: 'GEN',
            chapter: 1,
            verse: 1,
            text: 'En el principio creó Dios los cielos y la tierra.',
            reference: 'Génesis 1:1'
        };

        function formatVerseContent(content) {
            if (!content) return 'Texto no disponible';

            let cleanedContent = content.trim();
            const closingBracketIndex = cleanedContent.indexOf(']');

            if (closingBracketIndex !== -1) {
                cleanedContent = cleanedContent.substring(closingBracketIndex + 1).trim();
            }

            cleanedContent = cleanedContent.replace(/\s+/g, ' ');

            return `<div class="verse-body">${cleanedContent}</div>`;
        }

        function showVerse() {
            fitVerseToScreen();
            document.body.classList.add('has-verse');
            verseContainer.classList.add('visible');
        }

        function hideVerse() {
            verseContainer.classList.remove('visible');
            document.body.classList.remove('has-verse');
        }

        function applyThemeSettings(command) {
            if (typeof command.textX !== 'undefined') {
                const textX = Math.min(95, Math.max(5, parseInt(command.textX, 10) || 50));
                document.documentElement.style.setProperty('--verse-x', `${textX}%`);
            }

            if (typeof command.textY !== 'undefined') {
                const textY = Math.min(70, Math.max(5, parseInt(command.textY, 10) || 16));
                document.documentElement.style.setProperty('--verse-y', `${textY}%`);
                requestAnimationFrame(fitVerseToScreen);
            }

            if (typeof command.backgroundVisible !== 'undefined') {
                document.body.classList.toggle('background-hidden', command.backgroundVisible === false);
            }
        }

        function getMaxFontSize() {
            return window.innerWidth <= 720 ? mobileMaxFont : Math.min(desktopMaxFont, window.innerWidth * 0.0425);
        }

        function fitVerseToScreen() {
            const availableHeight = Math.max(160, window.innerHeight - verseContainer.offsetTop - (window.innerHeight * 0.04));
            const maxFont = getMaxFontSize();
            let fontSize = maxFont;

            verseContainer.style.maxHeight = `${availableHeight}px`;
            document.documentElement.style.setProperty('--verse-font-size', `${fontSize}px`);

            while (fontSize > minFont && verseContainer.scrollHeight > availableHeight) {
                fontSize -= 2;
                document.documentElement.style.setProperty('--verse-font-size', `${fontSize}px`);
            }
        }

        async function loadVerse(bookId, chapterNumber, verseNumber) {
            try {
                const response = await fetch(`https://biblia-api.qhar.in/book/${bookId}/chapter/${chapterNumber}/verse/${verseNumber}`);

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const verseDataArray = await response.json();

                if (!verseDataArray || verseDataArray.length === 0) {
                    throw new Error('No se encontró el versículo');
                }

                const verseData = verseDataArray[0];
                const formattedContent = formatVerseContent(verseData.content);

                verseText.innerHTML = formattedContent;
                verseReference.textContent = verseData.reference || 'Referencia no disponible';
                fitVerseToScreen();

                currentVerse = {
                    book: bookId,
                    chapter: chapterNumber,
                    verse: verseNumber,
                    text: formattedContent,
                    reference: verseData.reference
                };

                return true;
            } catch (error) {
                console.error('Error al cargar el versículo:', error);
                verseText.innerHTML = '<div class="verse-body">Error al cargar el versículo</div>';
                verseReference.textContent = 'Error';
                return false;
            }
        }

        function processCommand(command) {
            applyThemeSettings(command);

            if (command.action === 'load') {
                if (command.content) {
                    verseText.innerHTML = command.content;
                    verseReference.textContent = command.reference;
                    fitVerseToScreen();
                    if (command.show !== false) showVerse();
                } else {
                    loadVerse(command.book, command.chapter, command.verse).then(success => {
                        if (success && command.show) {
                            showVerse();
                        }
                    });
                }
            } else if (command.action === 'show') {
                showVerse();
            } else if (command.action === 'hide') {
                hideVerse();
            }
        }

        function listenForCommands() {
            window.addEventListener('storage', function (e) {
                if (e.key === 'bibleVerseCommand') {
                    const rawCommand = localStorage.getItem('bibleVerseCommand');
                    if (!rawCommand) return;

                    processCommand(JSON.parse(rawCommand));
                    localStorage.removeItem('bibleVerseCommand');
                }
            });

            const pendingCommand = localStorage.getItem('bibleVerseCommand');
            if (pendingCommand) {
                processCommand(JSON.parse(pendingCommand));
                localStorage.removeItem('bibleVerseCommand');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            hideVerse();
            listenForCommands();
        });

        window.addEventListener('resize', fitVerseToScreen);
    </script>
</body>

</html>
